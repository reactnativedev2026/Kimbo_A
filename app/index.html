<!DOCTYPE html>
<html lang="en">
<head>

    <title>Kimbo AI Backend API</title>
    <style>

        .container { background-color: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 600px; width: 100%; text-align: center; }

        p { color: #7f8c8d; font-size: 1.1em; line-height: 1.6; }

        .btn-swagger:hover { background-color: #2ecc71; }
        .btn-redoc { background-color: #2980b9; }

        <a href="/docs" class="btn btn-swagger">Go to Swagger UI (Test APIs)</a>
